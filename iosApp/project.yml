name: WornPantiesShop

options:
  bundleIdPrefix: com.satanius
  deploymentTarget:
    iOS: "15.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.19.2"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "10.0.0"

targets:
  WornPantiesShop:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.generated.plist
      properties:
        CFBundleDisplayName: WornPantiesShop
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.327586057169-7rkng6m9b0hhegc7h9hheuv7v4vfmobb
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.satanius.wornpantiesshop
        PRODUCT_NAME: WornPantiesShop
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WornPantiesShop.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Frameworks"
    dependencies:
      - framework: Frameworks/Shared.framework
        embed: false
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
